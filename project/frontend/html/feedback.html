<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .feedback-container {
            margin-top: 50px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <h1>Feedback Results</h1>
        <pre>{{ feedback | tojson(indent=2) }}</pre>
    </div>
</body>
</html>
