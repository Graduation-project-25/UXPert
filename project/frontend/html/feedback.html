<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Plugin Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        #feedback-container {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto; /* Allow scrolling for long messages */
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            background: #f9f9f9;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Design Consistency Checker</h1>
    <button id="start">Start Detection</button>
    
    <div id="feedback-container"></div>

    <script>
        const startButton = document.getElementById('start');
        const feedbackContainer = document.getElementById('feedback-container');

        startButton.onclick = () => {
            feedbackContainer.innerHTML = ""; // Clear previous feedback
            parent.postMessage({ pluginMessage: { type: 'start-detection' } }, '*'); // Start detection
        };

        onmessage = (event) => {
            const msg = event.data.pluginMessage;

            if (msg.type === 'feedback') {
                // Display feedback messages
                const feedbackMessages = Object.values(msg.feedback).map(item => `<p>${item}</p>`).join("");
                feedbackContainer.innerHTML = feedbackMessages; // Add feedback messages to the container
            }
        };
    </script>
</body>
</html>
