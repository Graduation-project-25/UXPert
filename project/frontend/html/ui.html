<!DOCTYPE html>
<html lang="en">

<head>
  <title>Figma Plugin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #feedback-screen {
      display: none;
    }

    #processing-screen {
      display: none;
    }
  </style>
</head>

<body>
  <div id="initial-screen">
    <h1>Start Detection</h1>
    <button id="start">Start</button>
  </div>
  <div id="processing-screen">
    <h1>Processing...</h1>
    <p>Please wait while the design is being evaluated.</p>
  </div>
  <div id="feedback-screen">
    <h1>Feedback</h1>
    <pre id="feedback-text"></pre>
    <button id="close">Close</button>
  </div>

  <script>
    const startButton = document.getElementById('start');
    const closeButton = document.getElementById('close');
    const initialScreen = document.getElementById('initial-screen');
    const processingScreen = document.getElementById('processing-screen');
    const feedbackScreen = document.getElementById('feedback-screen');
    const feedbackText = document.getElementById('feedback-text');

    startButton.onclick = () => {
      // Switch to processing screen
      initialScreen.style.display = 'none';
      processingScreen.style.display = 'block';

      // Start detection and send data to the plugin
      parent.postMessage({
        pluginMessage: {
          type: 'start-detection'
        }
      }, '*');
    };

    closeButton.onclick = () => {
      figma.closePlugin();
    };

    // Listen for messages from the plugin
    // <!-- onmessage = (msg) => {
    //  console.log("📩 Received message in UI:", msg.data); 


    //  if (msg && msg.type === 'feedback') {
    //        console.log("✅ Processing feedback message:", msg.feedback);

    //  processingScreen.style.display = 'none';
    //  feedbackScreen.style.display = 'block';

    //  feedbackText.textContent = msg.feedback;
    // }
    // }; -->
  </script>
</body>

</html>
