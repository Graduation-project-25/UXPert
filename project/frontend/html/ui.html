<!DOCTYPE html>
<html lang="en">

<head>
  <title>Figma Plugin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #feedback-screen,
    #processing-screen {
      display: none;
    }
  </style>
</head>

<body>
  <div id="initial-screen">
    <h1>Start Detection</h1>
    <button id="start">Start</button>
  </div>

  <div id="processing-screen">
    <h1>Processing...</h1>
    <p>Please wait while the design is being evaluated.</p>
  </div>

  <div id="feedback-screen">
    <h1>Feedback</h1>
    <pre id="feedback-text"></pre>
    <button id="close">Close</button>
  </div>

  <script>
    const startButton = document.getElementById('start');
    const closeButton = document.getElementById('close');
    const initialScreen = document.getElementById('initial-screen');
    const processingScreen = document.getElementById('processing-screen');
    const feedbackScreen = document.getElementById('feedback-screen');
    const feedbackText = document.getElementById('feedback-text');

    startButton.onclick = () => {
      initialScreen.style.display = 'none';
      processingScreen.style.display = 'block';

      parent.postMessage({
        pluginMessage: {
          type: 'start-detection'
        }
      }, '*');
    };

    closeButton.onclick = () => {
      parent.postMessage({
        pluginMessage: {
          type: 'close-plugin'
        }
      }, '*');
    };



    // window.addEventListener("message", function(event) {
    // // The data object will contain your pluginMessage
    //const msg = event.data.pluginMessage;
    //if (msg && msg.type === 'feedback') {
    // console.log("Received feedback:", msg.feedback);

    // Process the feedback
    //processingScreen.style.display = 'none';
    //feedbackScreen.style.display = 'block';
    //feedbackText.textContent = JSON.stringify(msg.feedback, null, 2);
    //}
    //});
    // Listen for messages from the plugin
    window.onmessage = (event) => {
      console.log('Message received:', event.data.pluginMessage); // For debugging
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'feedback') {
        // Process the feedback and display it
        console.log("Feedback:", msg.feedback);
        document.getElementById('feedback-text').textContent = msg.feedback;
      }
    };
  </script>
</body>

</html>
