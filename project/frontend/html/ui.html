<!DOCTYPE html>
<html lang="en">
<head>
  <title>Figma Plugin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: linear-gradient(to right, #a8c0ff, #3f94f8); /* Gradient background */
    }

    #initial-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      font-size: 36px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
      text-transform: uppercase; /* More modern heading */
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
      border: none;
      background: linear-gradient(45deg, #008CBA, #00c6ff); /* Gradient button */
      color: white;
      border-radius: 50px; /* Rounded button */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease-in-out;
      transform-origin: center;
    }

    button:hover {
      background: linear-gradient(45deg, #00c6ff, #008CBA);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      transform: scale(1.1); /* Slightly enlarge button on hover */
    }

    button:active {
      transform: scale(1); /* Button presses back to normal size */
    }

    #processing-screen, #feedback-screen, #progress-container {
      display: none;
    }

    #processing-screen h1, #feedback-screen h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 30px;
    }

    #processing-screen p {
      font-size: 18px;
      color: #555;
    }

    #progress-container {
      margin-top: 20px;
    }

    progress {
      width: 100%;
      height: 20px;
      border-radius: 10px;
      background-color: #e0e0e0; /* Light grey background for the progress bar */
    }
    
    progress::-webkit-progress-bar {
      background-color: #0b55a9;
    }
    
    progress::-webkit-progress-value {
      background-color: #fff; 
    }
    
    progress::-moz-progress-bar {
      background-color: #fff;
    }
    

    #feedback-container {
      margin-top: 30px;
    }

    .feedback-card {
      display: none;
      align-items: flex-start;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
      margin: 15px;
      padding: 15px;
      text-align: left;
      transition: transform 0.3s ease;
    }

    .screenshot {
      max-width: 150px;
      border-radius: 5px;
      margin-right: 15px;
      transition: transform 0.2s;
    }

    .screenshot:hover {
      transform: scale(1.2);
    }

    .feedback-content {
      flex: 1;
      text-align: left;
    }

    .feedback-content ul {
      padding-left: 20px;
    }

    .feedback-content li {
      margin-bottom: 5px;
    }

    .divider {
      height: 1px;
      background-color: #e0e0e0;
      margin: 10px 0;
    }

    #nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    #nav-buttons button {
      font-size: 16px;
      padding: 8px 20px;
    }
  </style>
</head>
<body>
  <div id="initial-screen">
    <h1>Start Detection</h1>
    <button id="start">Start</button>
  </div>

  <div id="processing-screen">
    <h1>Processing...</h1>
    <p>Please wait while the design is being evaluated.</p>
    <div id="progress-container">
      <progress id="progress-bar" max="100" value="0"></progress>
      <p id="progress-text">0%</p>
    </div>
  </div>

  <div id="feedback-screen">
    <h1>Feedback</h1>
    <div id="feedback-container"></div>
    <div id="nav-buttons">
      <button id="prev" disabled>Previous</button>
      <button id="next" disabled>Next</button>
    </div>
    <button id="close">Close</button>
  </div>

  <script>
    let currentFeedbackIndex = 0;
    let feedbackCards = [];

    document.getElementById('start').onclick = () => {
      document.getElementById('initial-screen').style.display = 'none';
      document.getElementById('processing-screen').style.display = 'block';
      document.getElementById('progress-container').style.display = 'block';

      let progress = 0;

      // Start detection in parallel
      parent.postMessage({ pluginMessage: { type: 'start-detection' } }, '*');

      const progressInterval = setInterval(() => {
        progress += 7; // Increment progress by 10%
        document.getElementById('progress-bar').value = progress;
        document.getElementById('progress-text').innerText = `${progress}%`;

        if (progress >= 100) {
          clearInterval(progressInterval);
          // After progress completes, trigger the feedback collection
          // parent.postMessage({ pluginMessage: { type: 'start-detection' } }, '*');
        }
      }, 1000);
    };

    document.getElementById('close').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    };

    document.getElementById('prev').onclick = () => {
      if (currentFeedbackIndex > 0) {
        showFeedbackCard(currentFeedbackIndex - 1);
      }
    };

    document.getElementById('next').onclick = () => {
      if (currentFeedbackIndex < feedbackCards.length - 1) {
        showFeedbackCard(currentFeedbackIndex + 1);
      }
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (!msg) return;

      if (msg.type === 'collective-feedback') {
        console.log("Received feedback:", msg.feedback); // Debugging

        document.getElementById('processing-screen').style.display = 'none';
        document.getElementById('feedback-screen').style.display = 'block';
        document.getElementById('feedback-container').innerHTML = '';

        if (!msg.feedback || msg.feedback.length === 0) {
          document.getElementById('feedback-container').innerHTML = '<p>No feedback received.</p>';
          return;
        }

        feedbackCards = msg.feedback.map(item => {
          const card = document.createElement('div');
          card.className = 'feedback-card';

          // Ensure the screenshot exists before displaying
          if (item.screenshot) {
            const image = document.createElement('img');
            image.src = item.screenshot;
            image.className = 'screenshot';
            card.appendChild(image);
          }

          let feedbackList = '<ul>';
          if (item.consistencyFeedback) {
            for (const [issue, solution] of Object.entries(item.consistencyFeedback)) {
              feedbackList += `<li><strong>${issue}:</strong> ${solution}</li>`;
            }
          }
          if (item.minimalistFeedback) {
            for (const [issue, solution] of Object.entries(item.minimalistFeedback)) {
              feedbackList += `<li><strong>${issue}:</strong> ${solution}</li>`;
            }
          }
          feedbackList += '</ul>';

          const content = document.createElement('div');
          content.className = 'feedback-content';
          content.innerHTML = `<h2>${item.frameName}</h2><div class='divider'></div>${feedbackList}`;

          card.appendChild(content);
          document.getElementById('feedback-container').appendChild(card);

          return card;
        });

        showFeedbackCard(0); // Show the first card by default
      }
    };


    function showFeedbackCard(index) {
      feedbackCards.forEach((card, i) => {
        card.style.display = i === index ? 'flex' : 'none';
      });
      currentFeedbackIndex = index;
      document.getElementById('prev').disabled = currentFeedbackIndex === 0;
      document.getElementById('next').disabled = currentFeedbackIndex === feedbackCards.length - 1;
    }

    // Enable arrow key navigation
    window.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') {
        document.getElementById('prev').click();
      } else if (event.key === 'ArrowRight') {
        document.getElementById('next').click();
      }
    });
  </script>
</body>
</html>
