<!DOCTYPE html>
<html lang="en">
<head>
  <title>Figma Plugin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    #feedback-screen, #processing-screen {
      display: none;
    }

    .feedback-card {
      display: flex;
      align-items: flex-start;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
      margin: 15px;
      padding: 15px;
      text-align: left;
    }

    .screenshot {
      max-width: 150px;
      border-radius: 5px;
      margin-right: 15px;
      transition: transform 0.2s;
    }

    .screenshot:hover {
      transform: scale(1.2);
    }

    .feedback-content {
      flex: 1;
      text-align: left;
    }

    .feedback-content ul {
      padding-left: 20px;
    }

    .feedback-content li {
      margin-bottom: 5px;
    }

    .divider {
      height: 1px;
      background-color: #e0e0e0;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="initial-screen">
    <h1>Start Detection</h1>
    <button id="start">Start</button>
  </div>

  <div id="processing-screen">
    <h1>Processing...</h1>
    <p>Please wait while the design is being evaluated.</p>
  </div>

  <div id="feedback-screen">
    <h1>Feedback</h1>
    <div id="feedback-container"></div>
    <button id="close">Close</button>
  </div>

  <script>
    document.getElementById('start').onclick = () => {
      document.getElementById('initial-screen').style.display = 'none';
      document.getElementById('processing-screen').style.display = 'block';
      parent.postMessage({ pluginMessage: { type: 'start-detection' } }, '*');
    };

    document.getElementById('close').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'collective-feedback') {
        document.getElementById('processing-screen').style.display = 'none';
        document.getElementById('feedback-screen').style.display = 'block';
        document.getElementById('feedback-container').innerHTML = '';

        msg.feedback.forEach(item => {
          const card = document.createElement('div');
          card.className = 'feedback-card';

          const image = document.createElement('img');
          image.src = item.screenshot;
          image.className = 'screenshot';

          let feedbackList = '<ul>';
          for (const [issue, solution] of Object.entries(item.feedback)) {
              feedbackList += `<li><strong>${issue}:</strong> ${solution}</li>`;
          }
          feedbackList += '</ul>';

          const content = document.createElement('div');
          content.className = 'feedback-content';
          content.innerHTML = `<h2>${item.frameName}</h2><div class='divider'></div>${feedbackList}`;

          card.appendChild(image);
          card.appendChild(content);
          document.getElementById('feedback-container').appendChild(card);
        });
      }
    };
  </script>
</body>
</html>
