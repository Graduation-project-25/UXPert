

 <!DOCTYPE html>
 <html lang="en">
   <head>
     <title>Figma Plugin</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <style>
       body {
         font-family: Arial, sans-serif;
         text-align: center;
         margin: 0;
         padding: 20px;
       }
       button {
         padding: 10px 20px;
         font-size: 16px;
         cursor: pointer;
         border: none;
         background-color: #007bff;
         color: white;
         border-radius: 5px;
       }
       button:hover {
         background-color: #0056b3;
       }
     </style>
   </head>
   <body>
     <h1>Start Detection</h1>
     <button id="start">Start</button>
     <script>
       const startButton = document.getElementById('start');
       startButton.onclick = () => parent.postMessage({ pluginMessage: { type: 'start-detection' } }, '*');
     </script>
   </body>
 </html>
